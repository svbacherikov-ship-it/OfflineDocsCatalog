plugins { id 'com.android.application' }

android {
  namespace 'ru.amafor.offlinedocs'
  compileSdk 35

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }
  packaging {
    resources {
      merges += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
      excludes += ['META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/versions/**']
    }
  }
  defaultConfig {
    applicationId 'ru.amafor.offlinedocs.stable'
    minSdk 26
    targetSdk 35
    versionCode 10
    versionName '1.2.0'
  }
}

dependencies {
  implementation 'org.apache.poi:poi:6.0.0'
  implementation 'org.apache.poi:poi-scratchpad:6.0.0'
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
