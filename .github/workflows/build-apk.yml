name: Build Android Stable APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Collect APK signing tools
        run: |
          mkdir -p signing-tools/lib
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar signing-tools/lib/
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner signing-tools/
          chmod +x signing-tools/apksigner
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned APK and signer
        uses: actions/upload-artifact@v4
        with:
          name: OfflineDocsCatalog-v1.1.3-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools/**
          if-no-files-found: error
          retention-days: 30
